<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Skills Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="text-center mb-4">
                    <a href="index.html" class="text-decoration-none text-primary fs-3 fw-bold">
                        <i class="fa-solid fa-graduation-cap me-2"></i>Skills Portal
                    </a>
                </div>

                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                    <h4 class="fw-bold mb-1 text-center">Create Student Account</h4>
                    <p class="text-muted small text-center mb-4">Join our learning platform and earn certified credentials</p>

                    <div id="alertBox" class="alert d-none py-2 small"></div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Full Name</label>
                            <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Email Address</label>
                                <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Phone Number</label>
                                <input type="tel" id="phone" class="form-control" placeholder="+1234567890" required>
                            </div>
                        </div>

                        <div class="row g-2 mb-4">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Password</label>
                                <input type="password" id="password" class="form-control" placeholder="At least 6 characters" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Confirm Password</label>
                                <input type="password" id="confirm_password" class="form-control" placeholder="Confirm your password" required>
                            </div>
                        </div>

                        <button type="submit" id="btnRegister" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mb-3">
                            <i class="fa-solid fa-user-plus me-1"></i> Register Account
                        </button>
                    </form>

                    <div class="text-center">
                        <small class="text-muted">Already have an account? <a href="login.html" class="fw-bold text-primary">Sign In</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        const form = document.getElementById('registerForm');
        const alertBox = document.getElementById('alertBox');
        const btnRegister = document.getElementById('btnRegister');

        function showAlert(msg, isSuccess = false) {
            alertBox.className = `alert alert-${isSuccess ? 'success' : 'danger'} py-2 small`;
            alertBox.innerHTML = `<i class="fa-solid fa-${isSuccess ? 'circle-check' : 'circle-exclamation'} me-1"></i> ${msg}`;
            alertBox.classList.remove('d-none');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;

            if (password !== confirm_password) {
                showAlert('Passwords do not match.');
                return;
            }

            btnRegister.disabled = true;
            btnRegister.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Creating Account...`;
            alertBox.classList.add('d-none');

            try {
                const res = await API.auth.register({ name, email, phone, password, confirm_password });
                showAlert(res.message || 'Account created! Redirecting to login...', true);
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1200);
            } catch (err) {
                showAlert(err.message || 'Registration failed.');
                btnRegister.disabled = false;
                btnRegister.innerHTML = `<i class="fa-solid fa-user-plus me-1"></i> Register Account`;
            }
        });
    </script>
</body>
</html>
