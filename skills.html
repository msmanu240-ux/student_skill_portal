<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Skills - Skills Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fa-solid fa-graduation-cap me-2"></i> Skills Portal
            </a>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="skills.html">Browse Skills</a></li>
                    <li class="nav-item"><a class="nav-link" href="courses.html">All Courses</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2" id="navAuth">
                    <button class="btn btn-outline-light btn-sm" onclick="openBackendConfig()"><i class="fa-solid fa-gear me-1"></i> API Settings</button>
                    <a href="login.html" class="btn btn-light btn-sm text-primary fw-bold">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="text-center mb-5">
            <h2 class="fw-bold">Explore Skill Categories</h2>
            <p class="text-muted">Choose your target discipline and master certified industry tools</p>
        </div>

        <div class="row g-4" id="skillsGrid">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-muted mt-2">Loading skills catalog from Vercel...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = getCurrentUser();
            if (user) {
                document.getElementById('navAuth').innerHTML = `
                    <button class="btn btn-outline-light btn-sm" onclick="openBackendConfig()"><i class="fa-solid fa-gear me-1"></i> API Settings</button>
                    <a href="dashboard.html" class="btn btn-light btn-sm text-primary fw-bold"><i class="fa-solid fa-gauge me-1"></i> Dashboard</a>
                    <button onclick="logoutUser()" class="btn btn-outline-light btn-sm">Logout</button>
                `;
            }

            try {
                const res = await API.skills.getAll();
                const grid = document.getElementById('skillsGrid');
                if (res.data && res.data.length > 0) {
                    grid.innerHTML = res.data.map(s => `
                        <div class="col-md-4 col-sm-6">
                            <div class="card h-100 border-0 shadow-sm rounded-4 p-4 text-center">
                                <div class="p-3 bg-light-primary text-primary rounded-circle d-inline-flex mx-auto mb-3">
                                    <i class="fa-solid fa-laptop-code fa-2x"></i>
                                </div>
                                <span class="badge bg-secondary mb-2 mx-auto px-3">${s.category || 'General'} &bull; ${s.level || 'All Levels'}</span>
                                <h5 class="fw-bold mb-2">${s.skill_name}</h5>
                                <p class="text-muted small flex-grow-1">${s.description || 'Master core concepts and advance your skills.'}</p>
                                <a href="courses.html?skill_id=${s.id}" class="btn btn-outline-primary btn-sm rounded-pill mt-3">
                                    View Courses <i class="fa-solid fa-arrow-right ms-1"></i>
                                </a>
                            </div>
                        </div>
                    `).join('');
                } else {
                    grid.innerHTML = '<div class="col-12 text-center text-muted">No skills found.</div>';
                }
            } catch (err) {
                document.getElementById('skillsGrid').innerHTML = `
                    <div class="alert alert-warning text-center py-4">
                        <i class="fa-solid fa-triangle-exclamation me-2"></i> Failed to connect to Vercel API. Click <strong>API Settings</strong> above to update your backend URL.
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
