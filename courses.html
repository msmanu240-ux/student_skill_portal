<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Courses - Skills Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fa-solid fa-graduation-cap me-2"></i> Skills Portal
            </a>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="skills.html">Browse Skills</a></li>
                    <li class="nav-item"><a class="nav-link active" href="courses.html">All Courses</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2" id="navAuth">
                    <button class="btn btn-outline-light btn-sm" onclick="openBackendConfig()"><i class="fa-solid fa-gear me-1"></i> API Settings</button>
                    <a href="login.html" class="btn btn-light btn-sm text-primary fw-bold">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h2 class="fw-bold mb-1">Available Training Courses</h2>
                <p class="text-muted mb-0">Select a course to stream lectures, take quizzes, and earn certificates</p>
            </div>
            <div class="d-flex gap-2">
                <select id="skillFilter" class="form-select form-select-sm" style="max-width: 220px;" onchange="loadCourses()">
                    <option value="0">All Skill Pathways</option>
                </select>
            </div>
        </div>

        <div class="row g-4" id="coursesGrid">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-muted mt-2">Loading courses from Vercel...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let selectedSkillId = parseInt(urlParams.get('skill_id')) || 0;

        document.addEventListener('DOMContentLoaded', async () => {
            const user = getCurrentUser();
            if (user) {
                document.getElementById('navAuth').innerHTML = `
                    <button class="btn btn-outline-light btn-sm" onclick="openBackendConfig()"><i class="fa-solid fa-gear me-1"></i> API Settings</button>
                    <a href="dashboard.html" class="btn btn-light btn-sm text-primary fw-bold"><i class="fa-solid fa-gauge me-1"></i> Dashboard</a>
                    <button onclick="logoutUser()" class="btn btn-outline-light btn-sm">Logout</button>
                `;
            }

            // Populate Skills Filter dropdown
            try {
                const skillsRes = await API.skills.getAll();
                const select = document.getElementById('skillFilter');
                (skillsRes.data || []).forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = s.skill_name;
                    if (s.id === selectedSkillId) opt.selected = true;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error(err);
            }

            loadCourses();
        });

        async function loadCourses() {
            const skillId = document.getElementById('skillFilter').value;
            const user = getCurrentUser();
            const grid = document.getElementById('coursesGrid');
            grid.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>';

            try {
                const res = await API.courses.getAll(skillId, user ? user.id : 0);
                if (res.data && res.data.length > 0) {
                    grid.innerHTML = res.data.map(c => `
                        <div class="col-md-4 col-sm-6">
                            <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden">
                                <div class="p-3 bg-primary text-white d-flex justify-content-between align-items-center">
                                    <span class="badge bg-warning text-dark">${c.skill_name || 'General'}</span>
                                    <small><i class="fa-regular fa-clock me-1"></i>${c.duration}</small>
                                </div>
                                <div class="card-body d-flex flex-column">
                                    <h5 class="card-title fw-bold mb-2">${c.course_name}</h5>
                                    <p class="text-muted small mb-2"><i class="fa-solid fa-chalkboard-user me-1 text-primary"></i>${c.instructor}</p>
                                    <p class="card-text text-muted small flex-grow-1">${c.description || ''}</p>
                                    
                                    <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
                                        <div class="text-warning small">
                                            <i class="fa-solid fa-star"></i> ${c.avg_rating > 0 ? c.avg_rating : 'New'} (${c.feedback_count || 0})
                                        </div>
                                        <a href="learning.html?course_id=${c.id}" class="btn btn-sm btn-primary">
                                            ${c.enrollment_status === 'Completed' ? '<i class="fa-solid fa-award me-1"></i>Review / Cert' : '<i class="fa-solid fa-play me-1"></i>Start Course'}
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    grid.innerHTML = '<div class="col-12 text-center text-muted py-5">No courses found matching this category.</div>';
                }
            } catch (err) {
                grid.innerHTML = `
                    <div class="alert alert-warning text-center py-4">
                        <i class="fa-solid fa-triangle-exclamation me-2"></i> Failed to connect to Vercel API. Click <strong>API Settings</strong> above to verify your backend URL.
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
