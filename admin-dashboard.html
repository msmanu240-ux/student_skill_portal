<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console - Skills Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Admin Nav -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="admin-dashboard.html">
                <i class="fa-solid fa-user-shield me-2 text-warning"></i> Admin Management Portal
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <button class="btn btn-outline-light btn-sm" onclick="openBackendConfig()"><i class="fa-solid fa-gear me-1"></i> API Settings</button>
                <span class="badge bg-warning text-dark px-3 py-2 fw-bold">Admin Console</span>
                <button onclick="logoutUser()" class="btn btn-danger btn-sm fw-bold">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <!-- Admin KPI Metrics -->
        <div class="row g-3 mb-4">
            <div class="col-md-2 col-sm-4 col-6">
                <div class="card border-0 shadow-sm p-3 bg-white text-center rounded-3">
                    <h3 class="fw-bold text-primary mb-0" id="kpiStudents">0</h3>
                    <small class="text-muted">Students</small>
                </div>
            </div>
            <div class="col-md-2 col-sm-4 col-6">
                <div class="card border-0 shadow-sm p-3 bg-white text-center rounded-3">
                    <h3 class="fw-bold text-success mb-0" id="kpiCourses">0</h3>
                    <small class="text-muted">Courses</small>
                </div>
            </div>
            <div class="col-md-2 col-sm-4 col-6">
                <div class="card border-0 shadow-sm p-3 bg-white text-center rounded-3">
                    <h3 class="fw-bold text-info mb-0" id="kpiSkills">0</h3>
                    <small class="text-muted">Skills</small>
                </div>
            </div>
            <div class="col-md-2 col-sm-4 col-6">
                <div class="card border-0 shadow-sm p-3 bg-white text-center rounded-3">
                    <h3 class="fw-bold text-warning mb-0" id="kpiEnrollments">0</h3>
                    <small class="text-muted">Enrollments</small>
                </div>
            </div>
            <div class="col-md-2 col-sm-4 col-6">
                <div class="card border-0 shadow-sm p-3 bg-white text-center rounded-3">
                    <h3 class="fw-bold text-danger mb-0" id="kpiCertificates">0</h3>
                    <small class="text-muted">Certificates</small>
                </div>
            </div>
            <div class="col-md-2 col-sm-4 col-6">
                <div class="card border-0 shadow-sm p-3 bg-white text-center rounded-3">
                    <h3 class="fw-bold text-warning mb-0" id="kpiRating">5.0 ⭐</h3>
                    <small class="text-muted">Avg Rating</small>
                </div>
            </div>
        </div>

        <!-- Management Tabs -->
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
            <ul class="nav nav-pills mb-4 gap-2" id="adminTabs" role="tablist">
                <li class="nav-item">
                    <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tabStudents" type="button" onclick="loadStudents()">
                        <i class="fa-solid fa-users me-1"></i> Students
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabCourses" type="button" onclick="loadAdminCourses()">
                        <i class="fa-solid fa-book-open me-1"></i> Courses
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabCertificates" type="button" onclick="loadAdminCertificates()">
                        <i class="fa-solid fa-award me-1"></i> Certificates
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabFeedback" type="button" onclick="loadAdminFeedback()">
                        <i class="fa-solid fa-star me-1"></i> Reviews
                    </button>
                </li>
            </ul>

            <div class="tab-content" id="adminTabContent">
                <!-- Students Tab -->
                <div class="tab-pane fade show active" id="tabStudents">
                    <div class="table-responsive" id="studentsTable">
                        <div class="text-center py-4"><div class="spinner-border text-primary"></div></div>
                    </div>
                </div>

                <!-- Courses Tab -->
                <div class="tab-pane fade" id="tabCourses">
                    <div class="table-responsive" id="coursesTable">
                        <div class="text-center py-4"><div class="spinner-border text-primary"></div></div>
                    </div>
                </div>

                <!-- Certificates Tab -->
                <div class="tab-pane fade" id="tabCertificates">
                    <div class="table-responsive" id="certificatesTable">
                        <div class="text-center py-4"><div class="spinner-border text-primary"></div></div>
                    </div>
                </div>

                <!-- Reviews Tab -->
                <div class="tab-pane fade" id="tabFeedback">
                    <div class="table-responsive" id="feedbackTable">
                        <div class="text-center py-4"><div class="spinner-border text-primary"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = requireAuth('admin');
            if (!user) return;

            // Load Admin KPIs
            try {
                const res = await API.stats.getAdminStats();
                const d = res.data;
                document.getElementById('kpiStudents').innerText = d.total_students;
                document.getElementById('kpiCourses').innerText = d.total_courses;
                document.getElementById('kpiSkills').innerText = d.total_skills;
                document.getElementById('kpiEnrollments').innerText = d.total_enrollments;
                document.getElementById('kpiCertificates').innerText = d.total_certificates;
                document.getElementById('kpiRating').innerText = `${d.avg_rating || '5.0'} ⭐`;
            } catch (err) {
                console.error(err);
            }

            loadStudents();
        });

        async function loadStudents() {
            try {
                const res = await API.students.getAll();
                const div = document.getElementById('studentsTable');
                div.innerHTML = `
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Enrolled</th>
                                <th>Completed</th>
                                <th>Certificates</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${(res.data || []).map(s => `
                                <tr>
                                    <td>${s.id}</td>
                                    <td><strong>${s.name}</strong></td>
                                    <td>${s.email}</td>
                                    <td>${s.phone}</td>
                                    <td><span class="badge bg-primary">${s.enrolled_count}</span></td>
                                    <td><span class="badge bg-success">${s.completed_count}</span></td>
                                    <td><span class="badge bg-warning text-dark">${s.certificates_count}</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (err) {
                document.getElementById('studentsTable').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
            }
        }

        async function loadAdminCourses() {
            try {
                const res = await API.courses.getAll();
                const div = document.getElementById('coursesTable');
                div.innerHTML = `
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Course Title</th>
                                <th>Pathway</th>
                                <th>Instructor</th>
                                <th>Duration</th>
                                <th>Rating</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${(res.data || []).map(c => `
                                <tr>
                                    <td>${c.id}</td>
                                    <td><strong>${c.course_name}</strong></td>
                                    <td><span class="badge bg-secondary">${c.skill_name || 'General'}</span></td>
                                    <td>${c.instructor}</td>
                                    <td>${c.duration}</td>
                                    <td>⭐ ${c.avg_rating}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (err) {
                document.getElementById('coursesTable').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
            }
        }

        async function loadAdminCertificates() {
            try {
                const res = await API.certificates.getAllForAdmin();
                const div = document.getElementById('certificatesTable');
                div.innerHTML = `
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Certificate ID</th>
                                <th>Recipient</th>
                                <th>Course</th>
                                <th>Score</th>
                                <th>Issue Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${(res.data || []).map(c => `
                                <tr>
                                    <td><code>${c.certificate_id}</code></td>
                                    <td><strong>${c.student_name}</strong></td>
                                    <td>${c.course_name}</td>
                                    <td><span class="badge bg-success">${c.score} / 10</span></td>
                                    <td>${c.issue_date}</td>
                                    <td>
                                        <a href="certificate.html?cert_id=${c.certificate_id}" target="_blank" class="btn btn-sm btn-outline-primary">
                                            <i class="fa-solid fa-eye me-1"></i> View
                                        </a>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (err) {
                document.getElementById('certificatesTable').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
            }
        }

        async function loadAdminFeedback() {
            try {
                const res = await API.feedback.getAllForAdmin();
                const div = document.getElementById('feedbackTable');
                div.innerHTML = `
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Student</th>
                                <th>Course</th>
                                <th>Rating</th>
                                <th>Review Comments</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${(res.data || []).map(f => `
                                <tr>
                                    <td><strong>${f.student_name}</strong></td>
                                    <td>${f.course_name}</td>
                                    <td><span class="badge bg-warning text-dark">${f.rating} ⭐</span></td>
                                    <td>${f.comments}</td>
                                    <td><small class="text-muted">${f.created_at}</small></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (err) {
                document.getElementById('feedbackTable').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
