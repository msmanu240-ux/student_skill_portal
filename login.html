<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Skills Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <a href="index.html" class="text-decoration-none text-primary fs-3 fw-bold">
                        <i class="fa-solid fa-graduation-cap me-2"></i>Skills Portal
                    </a>
                </div>

                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                    <h4 class="fw-bold mb-1 text-center">Welcome Back</h4>
                    <p class="text-muted small text-center mb-4">Sign in to your learning account</p>

                    <div id="alertBox" class="alert d-none py-2 small"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-regular fa-envelope text-muted"></i></span>
                                <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                            </div>
                        </div>

                        <button type="submit" id="btnLogin" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mb-3">
                            <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In
                        </button>
                    </form>

                    <!-- Auto Login Helper -->
                    <div class="p-3 bg-light rounded-3 border text-center mb-3">
                        <small class="text-muted d-block mb-2"><i class="fa-solid fa-bolt me-1 text-warning"></i> Developer Quick Access:</small>
                        <button type="button" class="btn btn-outline-warning btn-sm text-dark fw-bold me-1" onclick="autoLoginStudent()">
                            <i class="fa-solid fa-user-graduate me-1"></i> Demo Student
                        </button>
                        <button type="button" class="btn btn-outline-dark btn-sm fw-bold" onclick="autoLoginAdmin()">
                            <i class="fa-solid fa-user-shield me-1"></i> Admin Console
                        </button>
                    </div>

                    <div class="text-center">
                        <small class="text-muted">Don't have an account? <a href="register.html" class="fw-bold text-primary">Register Here</a></small>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <button class="btn btn-link btn-sm text-muted text-decoration-none" onclick="openBackendConfig()">
                        <i class="fa-solid fa-gear me-1"></i> Configure Vercel Backend URL
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const alertBox = document.getElementById('alertBox');
        const btnLogin = document.getElementById('btnLogin');

        function showAlert(msg, isSuccess = false) {
            alertBox.className = `alert alert-${isSuccess ? 'success' : 'danger'} py-2 small`;
            alertBox.innerHTML = `<i class="fa-solid fa-${isSuccess ? 'circle-check' : 'circle-exclamation'} me-1"></i> ${msg}`;
            alertBox.classList.remove('d-none');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btnLogin.disabled = true;
            btnLogin.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...`;
            alertBox.classList.add('d-none');

            try {
                const res = await API.auth.login({ email, password });
                showAlert(res.message || 'Login successful!', true);
                setCurrentUser(res.data.user, res.data.session_id);

                setTimeout(() => {
                    if (res.data.user.role === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }, 800);
            } catch (err) {
                showAlert(err.message || 'Invalid email or password.');
                btnLogin.disabled = false;
                btnLogin.innerHTML = `<i class="fa-solid fa-right-to-bracket me-1"></i> Sign In`;
            }
        });

        function autoLoginStudent() {
            document.getElementById('email').value = 'student@portal.com';
            document.getElementById('password').value = 'student123';
            form.dispatchEvent(new Event('submit'));
        }

        async function autoLoginAdmin() {
            try {
                const res = await API.auth.autoAdmin();
                setCurrentUser(res.data.user, res.data.session_id);
                window.location.href = 'admin-dashboard.html';
            } catch (err) {
                showAlert(err.message || 'Could not auto-login admin.');
            }
        }
    </script>
</body>
</html>
