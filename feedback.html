<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Review & Rating - Skills Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
                    <h4 class="fw-bold mb-1 text-center">Course Feedback</h4>
                    <p class="text-muted small text-center mb-4">Share your rating and thoughts on the course training</p>

                    <div id="alertBox" class="alert d-none py-2 small"></div>

                    <form id="feedbackForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Select Star Rating</label>
                            <select id="rating" class="form-select" required>
                                <option value="5">⭐⭐⭐⭐⭐ 5 Stars - Outstanding Training</option>
                                <option value="4">⭐⭐⭐⭐ 4 Stars - Very Good</option>
                                <option value="3">⭐⭐⭐ 3 Stars - Average</option>
                                <option value="2">⭐⭐ 2 Stars - Needs Improvement</option>
                                <option value="1">⭐ 1 Star - Poor</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold">Comments & Feedback</label>
                            <textarea id="comments" class="form-control" rows="4" placeholder="What did you like about this course?" required></textarea>
                        </div>

                        <button type="submit" id="btnSubmitFeedback" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mb-3">
                            <i class="fa-solid fa-paper-plane me-1"></i> Submit Review
                        </button>
                    </form>

                    <div class="text-center">
                        <a href="dashboard.html" class="btn btn-link text-muted small text-decoration-none">
                            <i class="fa-solid fa-arrow-left me-1"></i> Return to Student Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = parseInt(urlParams.get('course_id')) || 1;

        document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = requireAuth('student');
            if (!user) return;

            const rating = parseInt(document.getElementById('rating').value);
            const comments = document.getElementById('comments').value.trim();
            const alertBox = document.getElementById('alertBox');
            const btn = document.getElementById('btnSubmitFeedback');

            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Submitting...`;

            try {
                const res = await API.feedback.submit(user.id, courseId, rating, comments);
                alertBox.className = 'alert alert-success py-2 small';
                alertBox.innerHTML = `<i class="fa-solid fa-circle-check me-1"></i> ${res.message || 'Feedback submitted!'}`;
                alertBox.classList.remove('d-none');

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1200);
            } catch (err) {
                alertBox.className = 'alert alert-danger py-2 small';
                alertBox.innerHTML = `<i class="fa-solid fa-circle-exclamation me-1"></i> ${err.message || 'Submission failed.'}`;
                alertBox.classList.remove('d-none');
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-paper-plane me-1"></i> Submit Review`;
            }
        });
    </script>
</body>
</html>
