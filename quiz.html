<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Assessment - Skills Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="dashboard.html">
                <i class="fa-solid fa-graduation-cap me-2"></i> Skills Portal
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <span class="badge bg-warning text-dark px-3 py-2 fw-bold"><i class="fa-solid fa-clock me-1"></i> Passing Score: 7 / 10</span>
                <a href="dashboard.html" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-xmark me-1"></i> Exit</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 bg-white">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3 border-bottom pb-3">
                        <div>
                            <h4 class="fw-bold mb-1" id="quizCourseTitle">Course Assessment</h4>
                            <p class="text-muted small mb-0">Answer all 10 questions. Score 7 or higher to pass and unlock your Certificate.</p>
                        </div>
                        <span class="badge bg-primary px-3 py-2" id="quizCountBadge">10 Questions</span>
                    </div>

                    <div id="loadingBox" class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="text-muted mt-2">Loading assessment questions...</p>
                    </div>

                    <form id="quizForm" class="d-none">
                        <div id="questionsList"></div>

                        <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                            <a id="btnBackToLesson" href="#" class="btn btn-outline-secondary">
                                <i class="fa-solid fa-arrow-left me-1"></i> Review Lecture
                            </a>
                            <button type="submit" id="btnSubmitQuiz" class="btn btn-success px-4 py-2 fw-bold shadow-sm">
                                <i class="fa-solid fa-check-circle me-1"></i> Submit Assessment
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = parseInt(urlParams.get('course_id')) || 1;

        document.addEventListener('DOMContentLoaded', async () => {
            const user = requireAuth('student');
            if (!user) return;

            document.getElementById('btnBackToLesson').href = `learning.html?course_id=${courseId}`;

            try {
                const res = await API.quiz.getQuestions(courseId);
                const data = res.data;

                if (data.course) {
                    document.getElementById('quizCourseTitle').innerText = `${data.course.course_name} - Final Assessment`;
                }
                document.getElementById('quizCountBadge').innerText = `${data.total_questions} Questions`;

                const container = document.getElementById('questionsList');
                container.innerHTML = data.questions.map((q, idx) => `
                    <div class="p-3 mb-3 border rounded-3 bg-light">
                        <h6 class="fw-bold mb-3 text-dark">
                            <span class="badge bg-primary me-2">Q${idx + 1}</span> ${q.question_text}
                        </h6>
                        <div class="d-flex flex-column gap-2 ms-2">
                            <label class="form-check p-2 bg-white rounded border cursor-pointer d-flex align-items-center">
                                <input class="form-check-input me-3 ms-1" type="radio" name="q_${q.id}" value="A" required>
                                <span><strong>A)</strong> ${q.option_a}</span>
                            </label>
                            <label class="form-check p-2 bg-white rounded border cursor-pointer d-flex align-items-center">
                                <input class="form-check-input me-3 ms-1" type="radio" name="q_${q.id}" value="B" required>
                                <span><strong>B)</strong> ${q.option_b}</span>
                            </label>
                            <label class="form-check p-2 bg-white rounded border cursor-pointer d-flex align-items-center">
                                <input class="form-check-input me-3 ms-1" type="radio" name="q_${q.id}" value="C" required>
                                <span><strong>C)</strong> ${q.option_c}</span>
                            </label>
                            <label class="form-check p-2 bg-white rounded border cursor-pointer d-flex align-items-center">
                                <input class="form-check-input me-3 ms-1" type="radio" name="q_${q.id}" value="D" required>
                                <span><strong>D)</strong> ${q.option_d}</span>
                            </label>
                        </div>
                    </div>
                `).join('');

                document.getElementById('loadingBox').classList.add('d-none');
                document.getElementById('quizForm').classList.remove('d-none');
            } catch (err) {
                document.getElementById('loadingBox').innerHTML = `
                    <div class="alert alert-danger py-4 text-center">
                        <i class="fa-solid fa-triangle-exclamation me-2"></i> Error loading quiz questions: ${err.message}
                    </div>
                `;
            }
        });

        document.getElementById('quizForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = getCurrentUser();
            const btnSubmit = document.getElementById('btnSubmitQuiz');

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Grading Answers...`;

            const form = e.target;
            const answers = {};
            const radios = form.querySelectorAll('input[type="radio"]:checked');
            radios.forEach(r => {
                const qid = r.name.replace('q_', '');
                answers[qid] = r.value;
            });

            try {
                const res = await API.quiz.submitAnswers(user.id, courseId, answers);
                // Store result for display on results page
                sessionStorage.setItem('latest_quiz_result', JSON.stringify(res.data));
                window.location.href = `quiz-result.html?course_id=${courseId}`;
            } catch (err) {
                alert('Submission error: ' + err.message);
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-check-circle me-1"></i> Submit Assessment`;
            }
        });
    </script>
</body>
</html>
